name: Deploy to Vercel

# One-click / per-push production deploy.
# Required repo secret: VERCEL_API_TOKEN  (Settings → Secrets and variables → Actions)
# Optional repo secrets:
#   VERCEL_ADMIN_EMAIL   → sets ADMIN_EMAIL on the Vercel project (each deploy)
#   VERCEL_ADMIN_PASSWORD → sets ADMIN_PASSWORD on the Vercel project (each deploy)
#   VERCEL_AUTH_SECRET   → sets AUTH_SECRET (if omitted, one is generated once and kept)
#   VERCEL_SCOPE         → team slug, if your Vercel account belongs to a team

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Vercel (production)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROJECT: rozbolt
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      ADMIN_EMAIL_IN: ${{ secrets.VERCEL_ADMIN_EMAIL }}
      ADMIN_PASSWORD_IN: ${{ secrets.VERCEL_ADMIN_PASSWORD }}
      AUTH_SECRET_IN: ${{ secrets.VERCEL_AUTH_SECRET }}

    steps:
      - name: Preflight checks
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing repository secret VERCEL_API_TOKEN."
            echo "Create one at: https://vercel.com/account/tokens"
            echo "Then add it here: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "Token present ✔"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Ensure Vercel project exists and link
        run: |
          SCOPE=""
          [ -n "$VERCEL_SCOPE" ] && SCOPE="--scope $VERCEL_SCOPE"
          if ! vercel project ls $SCOPE --token "$VERCEL_TOKEN" --json 2>/dev/null \
               | jq -e --arg p "$VERCEL_PROJECT" 'any(.[]; .name == $p)' >/dev/null; then
            echo "Creating project '$VERCEL_PROJECT'…"
            vercel project add "$VERCEL_PROJECT" $SCOPE --token "$VERCEL_TOKEN"
          fi
          vercel link --yes --project "$VERCEL_PROJECT" $SCOPE --token "$VERCEL_TOKEN"

      - name: Configure environment variables
        run: |
          SCOPE=""
          [ -n "$VERCEL_SCOPE" ] && SCOPE="--scope $VERCEL_SCOPE"
          EXISTING=$(vercel env ls production $SCOPE --token "$VERCEL_TOKEN" --json 2>/dev/null || echo '[]')
          has() { echo "$EXISTING" | jq -e --arg n "$1" 'any(.[]; .key == $n)' >/dev/null 2>&1; }
          put() {  # name value → add or overwrite (production)
            vercel env rm "$1" production $SCOPE --token "$VERCEL_TOKEN" --yes >/dev/null 2>&1 || true
            printf '%s' "$2" | vercel env add "$1" production $SCOPE --token "$VERCEL_TOKEN" >/dev/null
            echo "  ✔ $1"
          }
          [ -n "$ADMIN_EMAIL_IN" ]    && { echo "Setting ADMIN_EMAIL…";    put ADMIN_EMAIL    "$ADMIN_EMAIL_IN"; }
          [ -n "$ADMIN_PASSWORD_IN" ] && { echo "Setting ADMIN_PASSWORD…"; put ADMIN_PASSWORD "$ADMIN_PASSWORD_IN"; }
          if [ -n "$AUTH_SECRET_IN" ]; then
            echo "Setting AUTH_SECRET…"; put AUTH_SECRET "$AUTH_SECRET_IN"
          elif ! has AUTH_SECRET; then
            echo "AUTH_SECRET not configured — generating one (kept across deploys)…"
            put AUTH_SECRET "$(openssl rand -hex 32)"
          else
            echo "AUTH_SECRET already set in project — leaving as-is."
          fi
          MISSING=""
          has AUTH_SECRET    || MISSING="$MISSING AUTH_SECRET"
          has ADMIN_EMAIL    || MISSING="$MISSING ADMIN_EMAIL"
          has ADMIN_PASSWORD || MISSING="$MISSING ADMIN_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "WARNING: no value for:$MISSING — admin login & signed sessions will not work on production."
          fi

      - name: Deploy to production
        id: deploy
        run: |
          SCOPE=""
          [ -n "$VERCEL_SCOPE" ] && SCOPE="--scope $VERCEL_SCOPE"
          OUT=$(vercel deploy --prod --yes $SCOPE --token "$VERCEL_TOKEN" 2>&1)
          echo "$OUT" | tail -20
          URL=$(printf '%s\n' "$OUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | tail -1)
          if [ -z "$URL" ]; then
            ALIAS=$(vercel project inspect "$VERCEL_PROJECT" $SCOPE --token "$VERCEL_TOKEN" --json 2>/dev/null \
                    | jq -r '[(.alias // .aliases // [])[]? | select(type=="string")] | first // empty' 2>/dev/null || true)
            [ -n "$ALIAS" ] && URL="https://$ALIAS"
          fi
          if [ -z "$URL" ]; then
            vercel ls $SCOPE --token "$VERCEL_TOKEN" 2>&1 | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' \
              | grep -v -- '-git-' | head -1 > /tmp/url.txt || true
            URL=$(cat /tmp/url.txt 2>/dev/null || true)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## 🚀 Deployment complete"
            [ -n "$URL" ] && echo "**Live at: $URL**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/fa" || true)
            [ "$code" = "200" ] && echo "OK: $URL/fa → 200" && exit 0
            echo "attempt $i: got $code — retrying…"; sleep 10
          done
          echo "::warning::Site not answering 200 yet on $URL/fa — check the Vercel dashboard."
