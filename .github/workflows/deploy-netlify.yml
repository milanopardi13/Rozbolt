name: Deploy to Netlify

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

concurrency:
  group: deploy-netlify
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Netlify
    if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_NAME_DEFAULT: rosie-atelier-milanopardi13
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm ci
          npm install @netlify/plugin-nextjs@latest --no-save
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest
      - name: Find or create Netlify site
        id: site
        env:
          NETLIFY_SITE_ID_OVERRIDE: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          site_id="$NETLIFY_SITE_ID_OVERRIDE"
          if [ -z "$site_id" ]; then
            site_id=$(netlify sites:list --json 2>/dev/null | jq -r --arg name "$SITE_NAME_DEFAULT" '.[] | select(.name == $name) | (.site_id // .id)' | head -n 1)
          fi
          if [ -z "$site_id" ]; then
            echo "Creating Netlify site $SITE_NAME_DEFAULT"
            created=$(netlify sites:create --name "$SITE_NAME_DEFAULT" --disable-linking --json 2>/dev/null | jq -r '.site_id // .id // empty' || true)
            if [ -z "$created" ]; then
              suffix="${SITE_NAME_DEFAULT}-$(date +%s)"
              echo "The default site name was unavailable; retrying as $suffix"
              created=$(netlify sites:create --name "$suffix" --disable-linking --json | jq -r '.site_id // .id // empty')
              echo "::warning::Site created as $suffix. Save its id as the NETLIFY_SITE_ID repository secret to skip lookup: $created"
            fi
            site_id="$created"
          fi
          if [ -z "$site_id" ]; then
            echo "::error::Could not find or create a Netlify site"
            exit 1
          fi
          echo "site_id=$site_id" >> "$GITHUB_OUTPUT"
          netlify link --id "$site_id"
      - name: Configure site environment
        env:
          REPO_AUTH_SECRET: ${{ secrets.NETLIFY_AUTH_SECRET }}
          REPO_ADMIN_EMAIL: ${{ secrets.NETLIFY_ADMIN_EMAIL }}
          REPO_ADMIN_PASSWORD: ${{ secrets.NETLIFY_ADMIN_PASSWORD }}
          REPO_UPSTASH_URL: ${{ secrets.NETLIFY_UPSTASH_URL }}
          REPO_UPSTASH_TOKEN: ${{ secrets.NETLIFY_UPSTASH_TOKEN }}
        run: |
          set -euo pipefail
          set_site_env() {
            netlify env:set "$1" "$2" >/dev/null
            echo "Configured $1"
          }
          if [ -n "$REPO_AUTH_SECRET" ]; then
            set_site_env AUTH_SECRET "$REPO_AUTH_SECRET"
          elif netlify env:get AUTH_SECRET >/dev/null 2>&1; then
            echo "AUTH_SECRET already exists on the site"
          else
            set_site_env AUTH_SECRET "$(openssl rand -hex 32)"
          fi
          if [ -n "$REPO_ADMIN_EMAIL" ]; then set_site_env ADMIN_EMAIL "$REPO_ADMIN_EMAIL"; fi
          if [ -n "$REPO_ADMIN_PASSWORD" ]; then set_site_env ADMIN_PASSWORD "$REPO_ADMIN_PASSWORD"; fi
          if ! netlify env:get ADMIN_EMAIL >/dev/null 2>&1 || ! netlify env:get ADMIN_PASSWORD >/dev/null 2>&1; then
            echo "::warning::Production admin login is disabled because ADMIN_EMAIL and ADMIN_PASSWORD are not both configured"
          fi
          if [ -n "$REPO_UPSTASH_URL" ] && [ -n "$REPO_UPSTASH_TOKEN" ]; then
            set_site_env UPSTASH_REDIS_REST_URL "$REPO_UPSTASH_URL"
            set_site_env UPSTASH_REDIS_REST_TOKEN "$REPO_UPSTASH_TOKEN"
          else
            echo "::notice::Admin content edits will not persist across deploys without both Upstash credentials"
          fi
      - name: Deploy to production
        id: deploy
        run: |
          set -euo pipefail
          output=$(netlify deploy --build --prod --message "GitHub Actions run #${{ github.run_number }} (${{ github.sha }})" 2>&1) || {
            printf '%s\n' "$output"
            echo "::error::Netlify deploy failed"
            exit 1
          }
          printf '%s\n' "$output" | tail -n 30
          if printf '%s\n' "$output" | grep -qiE '(^|[^[:alnum:]])(error|failed)([^[:alnum:]]|$)'; then
            echo "::error::Netlify deploy output indicates an error"
            exit 1
          fi
          live_url=$(netlify sites:list --json 2>/dev/null | jq -r --arg id "${{ steps.site.outputs.site_id }}" '.[] | select((.site_id // .id) == $id) | (.ssl_url // .url)' | head -n 1)
          if [ -z "$live_url" ]; then echo "::error::Could not resolve the public Netlify URL"; exit 1; fi
          echo "url=$live_url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sfL -o /dev/null -w '%{http_code}' "$url/fa" 2>/dev/null || true)
            if [ "$code" = "200" ]; then echo "Smoke test passed: $url/fa"; exit 0; fi
            echo "Smoke test attempt $attempt returned HTTP $code"
            [ "$attempt" = "5" ] || sleep 10
          done
          echo "::error::Smoke test failed: $url/fa did not return HTTP 200"
          exit 1
      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## Netlify deploy"
            if [ -n "${{ steps.deploy.outputs.url }}" ]; then echo "Live URL: ${{ steps.deploy.outputs.url }}"; fi
            echo "Site ID: ${{ steps.site.outputs.site_id }} (save it as NETLIFY_SITE_ID to skip lookup)"
          } >> "$GITHUB_STEP_SUMMARY"
